{{ template "header" . }}

<style>
  .map-page {
    text-align: center;
  }

  .map-page h1 {
    margin-bottom: 0.5rem;
  }

  .map-page p {
    margin-bottom: 1.25rem;
  }

  .map-frame {
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid #666;
    border-radius: 10px;
    padding: 1rem;
    display: inline-block;
    max-width: 100%;
  }

  .map-frame img {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
  }
</style>

<div class="map-page">
  <h1>CackalackyCon Map</h1>
  <p>Public floor map for conference explorers.</p>

  <div class="map-frame">
    <img src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/images/cackalackycon-map.png" alt="CackalackyCon map" />
  </div>
</div>

{{ template "footer" . }}
