nouns:
  booths: Four practice booths line the walls. Work each lock from out here. Look at BOOTH1, BOOTH2, BOOTH3, or CHALLENGE to see the prize.
  tables: Covered with every type of lock imaginable. A small prize table sits beside each booth.
  picks: Tension wrenches, rakes, hooks, diamonds - every pick style represented. Unregistered can sell you a cheap lockpick kit.
  locks: Padlocks, deadbolts, pin tumblers, disc detainers. A picker's paradise.
